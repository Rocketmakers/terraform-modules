variables:
  PROJECT_NAME: terraform-modules
  LOG_LEVEL: info

  # Required to validate and test the gitlab modules
  GITLAB_TOKEN: $GITLAB_ACCESS_TOKEN

stages:
  - analysis
  - notify

.base-rules:
  rules:
    # Current bug in gitlab rules will duplicate pipelines for open MRs
    - &ignore-mr-duplicate-pipeline
      if: $CI_MERGE_REQUEST_EVENT_TYPE == "detached"
      when: never
    - &ignore-mr-reminder
      if: $MERGE_REQUEST_REMINDER == "true"
      when: never
    - &not-on-schedules
      if: $CI_PIPELINE_SOURCE != "schedule"
    - &not-on-tags
      if: $CI_COMMIT_TAG == null
    - &only-on-tags
      if: $CI_COMMIT_TAG != null
      when: on_success

.internal-runner:
  tags:
    - rocketmakers-internal-dind

.defaults:
  extends:
    - .internal-runner
  retry:
    max: 2
    when: runner_system_failure
  image: rocketmakers/ci-terraform-gcp:3.2.0
  before_script:
    - make install-node-modules
  rules:
    - *ignore-mr-duplicate-pipeline
    - *ignore-mr-reminder
    - *not-on-schedules
    - *not-on-tags

##############
## Validate ##
##############

validate:
  extends:
    - .defaults
  stage: analysis
  script:
    - make validate
    - make format-all
    - git diff HEAD --exit-code

##########
## Docs ##
##########

docs:
  extends:
    - .defaults
  stage: analysis
  script:
    - make generate-docs
    - git diff HEAD --exit-code

############################
## Merge Request Reminder ##
############################

notify:merge-request-reminder:
  extends:
    - .defaults
  stage: notify
  image: bottlecapdave/gitlab-merge-request-reminder:1.3.0
  variables:
    SLACK_WEBHOOK_URL: $SLACK_WEBHOOK_URL_PLATFORM
    GITLAB_PROJECT_IDS: $CI_PROJECT_ID
    INCLUDE_WIP: 'false'
    INCLUDE_DRAFT: 'false'
  rules:
    - if: "$MERGE_REQUEST_REMINDER == 'true'"
    - *ignore-mr-duplicate-pipeline
  needs: []
  before_script: []
  script:
    - node /app/lib/index.js
