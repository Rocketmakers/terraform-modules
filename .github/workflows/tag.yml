name: Tag

on:
  push:
    tags:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG_NAME: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Create GitHub release
        run: gh release create $TAG_NAME --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG_NAME/CHANGELOG.md) for details"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

  notify_release:
    name: Notify release
    runs-on: ubuntu-latest
    needs:
      - create_release
    steps:
      - name: Notify slack
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PLATFORM }}
          webhook-type: incoming-webhook
          payload: |
            text: "Version ${{ github.ref_name }} of rocketmakers terraform modules has been released. See the changelog for details: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
